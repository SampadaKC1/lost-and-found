{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">My Reported Items</h2>

<div class="row">

{% for item in items %}
<div class="col-md-4 mb-4">
    <div class="card h-100">

        {% if item.image %}
        <img src="{{ item.image.url }}" class="card-img-top" height="250" style="object-fit:cover;">
        {% endif %}

        <div class="d-grid gap-2">

    <a href="{% url 'item_detail' item.id %}" class="btn btn-primary">
        View
    </a>

    <a href="{% url 'edit_item' item.id %}" class="btn btn-warning">
        Edit
    </a>

    <a href="{% url 'delete_item' item.id %}" class="btn btn-danger">
        Delete
    </a>

</div>

    </div>
</div>
{% empty %}
<p>You haven't reported any items yet.</p>
{% endfor %}

</div>

{% endblock %}
